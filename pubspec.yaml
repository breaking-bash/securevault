name: securevault
description: "SecureVault — a zero-knowledge, on-device encrypted password manager for Windows, Linux and Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Cryptography: Argon2id KDF + AES-256-GCM authenticated encryption
  cryptography: ^2.7.0

  # Local encrypted SQLite storage (works on Android + desktop via FFI)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24

  # Filesystem app-support directory for per-account vault DB files
  path_provider: ^2.1.4
  path: ^1.9.0

  # Simple state management
  provider: ^6.1.2

  # Biometric / fingerprint unlock (Android + desktop where supported)
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46

  # Biometric-gated OS keystore for storing the master password (zero-knowledge)
  flutter_secure_storage: ^9.2.2

  # TOTP QR-code scanner (mobile) and RFC 6238 one-time-password generation
  mobile_scanner: ^5.2.3
  otp: ^3.1.4
  base32: ^2.1.3

  # QR rendering for device linking
  qr_flutter: ^4.1.0
  file_picker: ^11.0.3
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.0

flutter:
  uses-material-design: true
