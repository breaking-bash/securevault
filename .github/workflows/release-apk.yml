name: Release Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm
      - name: Rename APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk SecureVault-${{ github.ref_name }}-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk SecureVault-${{ github.ref_name }}-arm32.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SecureVault-${{ github.ref_name }}-*.apk
          generate_release_notes: true
